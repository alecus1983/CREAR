    <div class="row">
        <h2>6. Datos acad&eacute;micos </h2>

        <div id="paginas">
            <p>
                Seleccione los elementos correspondintes a la matricula acad&eacute;mica
            </p>

            <form class="form-control">

                <div class="row mb-3">
                    <div class="col-sm-10 col-md-4 col-lg-3">
                        <label class="Control-label">jornada</label>
                        <select id="ac_jornada" class="form-control"
                            style="background: transparent;color: darkgreen;border:  0px">
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-sm-10 col-md-4 col-lg-3">
                        <label class="Control-label">Escolaridad</label>
                        <select id="ac_escolaridad" class="form-control"
                            style="background: transparent;color: darkgreen;border:  0px"
                            onchange="lista_grados($('#ac_escolaridad').val(),'#ac_grado',$('#id_docente').val());">
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-sm-10 col-md-4 col-lg-3">
                        <label class="Control-label">Grado</label>
                        <select id="ac_grado" class="form-control"
                            style="background: transparent;color: darkgreen;border:  0px">

                        </select>
                    </div>
                </div>



                <div class="row mb-3">
                    <div class="col-sm-10 col-md-4 col-lg-3">
                        <label class="Control-label">curso</label>
                        <select id="ac_curso" class="form-control"
                            style="background: transparent;color: darkgreen;border:  0px">
                            <option value="0" selected>A</option>
                            <option value="1">B</option>
                            <option value="2">C</option>
                            <option value="3">D</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-sm-10 col-md-6 col-lg-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="ac_proviene_otra_institucion">
                            <label class="form-check-label" for="ac_proviene_otra_institucion">
                                ¿Proviene de otra instituci&oacute;n?
                            </label>
                        </div>
                    </div>
                </div>

                <!-- datos de la institucion de procedencia: se habilitan con el check -->
                <fieldset id="ac_institucion_anterior_campos" disabled>

                    <div class="row mb-3">
                        <div class="col-sm-10 col-md-6 col-lg-4">
                            <label class="Control-label">Nombre de la instituci&oacute;n</label>
                            <input type="text" id="ac_institucion_anterior" class="form-control" maxlength="150">
                        </div>
                        <div class="col-sm-10 col-md-4 col-lg-3">
                            <label class="Control-label">Tipo</label>
                            <select id="ac_tipo_institucion" class="form-control">
                                <option value="" selected>Seleccione...</option>
                                <option value="Publico">P&uacute;blico</option>
                                <option value="Privado">Privado</option>
                                <option value="ICBF">ICBF</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-10 col-md-4 col-lg-3">
                            <label class="Control-label">Situaci&oacute;n acad&eacute;mica</label>
                            <select id="ac_situacion_academica" class="form-control">
                                <option value="" selected>Seleccione...</option>
                                <option value="Aprobó">Aprob&oacute;</option>
                                <option value="Reprobó">Reprob&oacute;</option>
                                <option value="Desertó">Desert&oacute;</option>
                                <option value="Se trasladó">Se traslad&oacute;</option>
                            </select>
                        </div>
                        <div class="col-sm-10 col-md-6 col-lg-4">
                            <label class="Control-label">Municipio de la instituci&oacute;n</label>
                            <input type="text" id="ac_municipio_institucion" class="form-control" maxlength="100">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-10 col-md-4 col-lg-3">
                            <label class="Control-label">Fecha de retiro</label>
                            <input type="date" id="ac_fecha_retiro" class="form-control">
                        </div>
                        <div class="col-sm-10 col-md-6 col-lg-5">
                            <label class="Control-label">Motivo de retiro</label>
                            <input type="text" id="ac_motivo_retiro" class="form-control" maxlength="255">
                        </div>
                    </div>

                </fieldset>

            </form>

            </select>

        </div>
