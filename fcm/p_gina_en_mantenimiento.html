<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en Mantenimiento</title>
    <!-- Cargando Tailwind CSS para los estilos modernos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cargando fuente de Google (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .loader-dots div {
            animation-timing-function: cubic-bezier(0, 1, 1, 0);
        }

        .loader-dots div:nth-child(1) {
            left: 8px;
            animation: loader-dots1 0.6s infinite;
        }

        .loader-dots div:nth-child(2) {
            left: 8px;
            animation: loader-dots2 0.6s infinite;
        }

        .loader-dots div:nth-child(3) {
            left: 32px;
            animation: loader-dots2 0.6s infinite;
        }

        .loader-dots div:nth-child(4) {
            left: 56px;
            animation: loader-dots3 0.6s infinite;
        }

        @keyframes loader-dots1 {
            0% {
                transform: scale(0);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes loader-dots3 {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(0);
            }
        }

        @keyframes loader-dots2 {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(24px, 0);
            }
        }
    </style>
</head>

<body
    class="min-h-screen bg-gradient-to-br from-slate-900 via-gray-800 to-slate-900 flex items-center justify-center p-4">

    <!-- Contenedor tipo tarjeta (Card) -->
    <main
        class="bg-white/95 backdrop-blur-sm shadow-2xl rounded-3xl p-8 md:p-12 max-w-lg w-full text-center relative overflow-hidden border border-gray-100">

        <!-- Elemento decorativo de fondo en la tarjeta -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 via-green-400 to-red-500"></div>

        <!-- Logo suministrado -->
        <div class="relative w-40 h-40 mx-auto mb-8 floating">
            <!-- Efecto de sombra difuminada detrás del logo -->
            <div class="absolute inset-0 bg-blue-200 blur-2xl rounded-full opacity-50"></div>
            <a href="../" target="_self"><img src="../images/escudo.png" alt="Logo de la organización"
                    class="relative w-full h-full object-contain drop-shadow-xl"></a>
        </div>

        <!-- Texto principal -->
        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4 tracking-tight">
            Sitio en Mantenimiento
        </h1>

        <p class="text-gray-500 text-base md:text-lg leading-relaxed mb-8">
            Estamos realizando algunas mejoras técnicas para ofrecerte una mejor experiencia. Volveremos a estar en
            línea muy pronto.
            <br><span class="font-semibold text-gray-700 mt-2 block">¡Gracias por tu paciencia!</span>
        </p>

        <!-- Indicador de carga animado -->
        <div class="flex justify-center items-center h-8">
            <div class="loader-dots relative w-20 h-5">
                <div class="absolute top-0 mt-1 w-3 h-3 rounded-full bg-blue-500"></div>
                <div class="absolute top-0 mt-1 w-3 h-3 rounded-full bg-green-500"></div>
                <div class="absolute top-0 mt-1 w-3 h-3 rounded-full bg-red-500"></div>
                <div class="absolute top-0 mt-1 w-3 h-3 rounded-full bg-yellow-600"></div>
            </div>
        </div>

    </main>

</body>

</html>
